# Rebuilds amd/build from amd/src, commits the result, and kicks off the
# per-version CI workflows against it.
#
# It runs by itself whenever amd/src changes on main, so a source change settles
# on its own. Expect the CI run that starts alongside the push to report the
# build as stale, since at that moment it is; the run this job triggers afterwards
# is the one that counts. Dispatch manually to rebuild without a source change.
#
# The build goes through `moodle-plugin-ci grunt`, the same command ci-core.yml
# uses to check the result. That matters more than it looks. Moodle ships no
# package-lock.json, so `npm install` resolves Babel and terser afresh every time,
# and two differently provisioned Moodle checkouts produce different bytes for the
# same source. An earlier version of this job cloned Moodle itself and ran grunt
# directly, which left every version reporting configuration.min.js as stale
# against a build that Moodle 5.1's own grunt had just produced.
#
# `moodle-plugin-ci grunt` backs the plugin's JS up, runs grunt over the plugin
# directory, then compares by sha1 and exits 1 on any difference. The output it
# leaves behind is what gets committed here; the non-zero exit is expected.

name: Rebuild AMD bundles

on:
  push:
    branches:
      - main
    paths:
      - 'amd/src/**'
  workflow_dispatch:

permissions:
  contents: write
  # To dispatch the CI workflows once the rebuilt bundles are committed.
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 3

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin
          ref: ${{ github.ref_name }}

      # Everything from here to the grunt step mirrors ci-core.yml. Keep them in
      # step: the point is that the builder and the checker share a toolchain.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_501_STABLE

      - name: Rebuild the bundles
        run: |
          set -eux
          # Moodle's grunt directly, not `moodle-plugin-ci grunt`. That command is
          # a checker: GruntCommand::restorePlugin() mirrors its backup back over
          # the plugin directory with delete and override once it has compared, so
          # it deliberately leaves no output. Two runs of this job reported success
          # and committed nothing before that was clear.
          #
          # It still runs inside the tree moodle-plugin-ci provisioned, so the
          # toolchain stays as close to the checker's as it can be.
          moodleroot=$(realpath moodle)
          moodledir=$(find moodle -type d -path '*/lib/editor/tiny/plugins/font_toolkit' | head -1)
          test -n "${moodledir}"

          # Driven from inside the component directory: Moodle's Gruntfile takes
          # grunt.moodleEnv.inComponent from the cwd, and that is what scopes
          # amdSrc to this plugin. --root from the Moodle root leaves rollup with
          # an empty file list and prints "Done." having built nothing.
          (cd "${moodledir}" && "${moodleroot}/node_modules/.bin/grunt" amd)

          src=$(realpath "${moodledir}/amd/build")
          dst=$(realpath plugin/amd/build)
          if [ "${src}" != "${dst}" ]; then
            cp -a "${src}/." "${dst}/"
          fi

          ls -l plugin/amd/build/

          for module in commands common configuration icons options plugin; do
            test -s "plugin/amd/build/${module}.min.js"
            test -s "plugin/amd/build/${module}.min.js.map"
            grep -q "define(\"tiny_font_toolkit/${module}\"" "plugin/amd/build/${module}.min.js"
          done

          # An `export default` has to be the module's return value or
          # editor_tiny drops the plugin without a word. See the README.
          grep -q 'return _exports\.default' plugin/amd/build/plugin.min.js

          # Proof that this build came from the current sources. A source map
          # carries the original text verbatim in sourcesContent, so comparing it
          # against amd/src catches a build that never ran. Unlike comparing the
          # compiled bytes, this does not depend on which Babel and terser versions
          # npm happened to resolve, so it holds even without a Moodle lockfile.
          node -e '
            const fs = require("fs");
            for (const m of ["commands", "common", "configuration", "icons", "options", "plugin"]) {
              const map = JSON.parse(fs.readFileSync(`plugin/amd/build/${m}.min.js.map`, "utf8"));
              const want = fs.readFileSync(`plugin/amd/src/${m}.js`, "utf8");
              const i = (map.sources || []).findIndex((s) => s.endsWith(`${m}.js`));
              const got = (map.sourcesContent || [])[i < 0 ? 0 : i];
              if (got !== want) {
                console.error(`${m}: the source map does not match amd/src, so grunt did not rebuild it`);
                process.exit(1);
              }
              console.log(`${m}: source map matches amd/src`);
            }
          '

      - name: Commit the rebuilt bundles
        id: commit
        working-directory: plugin
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add amd/build
          if git diff --cached --quiet; then
            echo 'amd/build is already up to date with amd/src.'
            echo 'committed=no' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild amd/build with Moodle's Grunt pipeline"
            git push
            echo 'committed=yes' >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI against the rebuilt bundles
        if: steps.commit.outputs.committed == 'yes'
        working-directory: plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          # A commit made with GITHUB_TOKEN deliberately triggers no workflows, so
          # without this the badges would keep showing the pre-rebuild result.
          for workflow in .github/workflows/moodle-*.yml; do
            gh workflow run "$(basename "${workflow}")" --ref "${GITHUB_REF_NAME}"
          done
