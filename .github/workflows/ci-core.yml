# The actual checks. Called once per supported Moodle version by the thin
# moodle-*.yml workflows.
#
# Why it is split that way: GitHub's badge API reports the status of a whole
# workflow, not of one leg of a matrix. A single workflow with a three-version
# matrix therefore yields one badge that goes red if any version breaks, which
# hides which one. One caller workflow per version gives one badge per version.

name: CI core

on:
  workflow_call:
    inputs:
      php:
        description: PHP version to test against
        required: true
        type: string
      moodle-branch:
        description: Moodle branch to install, e.g. MOODLE_501_STABLE
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 3

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ inputs.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ inputs.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # Runs ESLint over amd/src and checks amd/build against a fresh build,
      # failing if the committed output is stale. If this trips, run the
      # "Rebuild AMD bundles" workflow — see README, "Building the AMD modules".
      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # No phpunit / behat / mustache steps: the plugin has no tests and no
      # templates. It registers no commands and stores no data — all it does is
      # return a configuration array.

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
